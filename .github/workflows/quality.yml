name: Measured RAG quality gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  faithfulness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify current measured scores and pipeline provenance
        run: python -m src.quality_gate
