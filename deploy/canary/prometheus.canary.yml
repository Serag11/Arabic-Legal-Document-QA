global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: legal-qa
    metrics_path: /metrics
    static_configs:
      - targets: ["api-stable:8000"]
        labels: {track: stable}
      - targets: ["api-canary:8000"]
        labels: {track: canary}
