stages:
  extract_civil_code:
    cmd: uv run python src/extract_egyptian_civil_code.py data/1576751803.pdf 
      --out data/egyptian_civil_code_articles.jsonl --qa-dir data/qa_civil_code 
      --qa-count 20 --qa-seed 42
    deps:
    - data/1576751803.pdf
    - pyproject.toml
    - src/extract_egyptian_civil_code.py
    - uv.lock
    outs:
    - data/egyptian_civil_code_articles.jsonl
    - data/qa_civil_code
  validate_corpus:
    cmd: uv run python -m pytest tests/ -q
    deps:
    - data/egyptian_civil_code_articles.jsonl
    - tests
    - src/rag.py
    - src/retrieval.py
    - config/retrieval.json
    - src/generation.py
    - config/generation.json
    - prompts/answer_v1.txt
    - src/api.py
    - src/experiments.py
    - src/quality_gate.py
    - pyproject.toml
    - uv.lock
  prepare_retrieval:
    cmd: uv run python -m pytest tests/ -q && uv run python src/retrieval.py prepare
    deps:
    - data/egyptian_civil_code_articles.jsonl
    - src/rag.py
    - src/retrieval.py
    - src/extract_egyptian_civil_code.py
    - tests
    - src/generation.py
    - config/generation.json
    - prompts/answer_v1.txt
    - src/api.py
    - src/experiments.py
    - src/quality_gate.py
    - config/retrieval.json
    - pyproject.toml
    - uv.lock
    outs:
    - data/retrieval/chunks.jsonl
    - data/retrieval/chunks.manifest.json
  index_retrieval:
    cmd: uv run python src/retrieval.py index
    deps:
    - data/retrieval/chunks.jsonl
    - data/retrieval/chunks.manifest.json
    - src/rag.py
    - src/retrieval.py
    - src/extract_egyptian_civil_code.py
    - tests
    - config/retrieval.json
    - pyproject.toml
    - uv.lock
    outs:
    - data/retrieval/chroma
  evaluate_retrieval:
    cmd: uv run python src/retrieval.py evaluate
    deps:
    - data/retrieval/chroma
    - evaluation/retrieval_questions.jsonl
    - evaluation/review.json
    - src/rag.py
    - src/retrieval.py
    - src/extract_egyptian_civil_code.py
    - config/retrieval.json
    - pyproject.toml
    - uv.lock
    outs:
    - reports/retrieval-results.json:
        cache: false
    metrics:
    - reports/retrieval-results.metrics.json:
        cache: false
  prepare_answer_evaluation:
    cmd: uv run python -m src.experiments prepare
    deps:
    - evaluation/retrieval_questions.jsonl
    - evaluation/review.json
    - data/egyptian_civil_code_articles.jsonl
    - src/experiments.py
    - src/quality_gate.py
    - src/generation.py
    - src/rag.py
    - src/retrieval.py
    - pyproject.toml
    - uv.lock
    outs:
    - evaluation/answer_questions.jsonl:
        cache: false
    - evaluation/answer_questions.manifest.json:
        cache: false
