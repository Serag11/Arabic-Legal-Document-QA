[project]
name = "arabic-legal-document-qa"
version = "0.1.0"
description = "Article-aware Arabic/English legal retrieval and Google-backed cited answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "google-genai>=1,<3",
    "langfuse>=3,<5",
    "prometheus-client>=0.21,<1",
    "pyarabic>=0.6.15",
    "pydantic>=2,<3",
    "pymupdf>=1.28.2",
    "python-bidi>=0.6.11",
    "python-dotenv>=1,<2",
    "sentence-transformers>=5,<6",
    "torch==2.7.1",
    "transformers>=4.51,<5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "dvc[gdrive]>=3.67.1",
    "pyopenssl>=24.2.1,<=24.2.1",
    "pytest>=8.0",
]
evaluation = [
    "jsonref>=1,<2",
    "langchain-community>=0.3.27,<0.4",
    "mlflow>=3,<4",
    "ragas>=0.4,<0.5",
]
loadtest = [
    "locust>=2.32,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[project.scripts]
legal-qa = "src.rag:main"
legal-qa-evaluate = "src.experiments:main"
