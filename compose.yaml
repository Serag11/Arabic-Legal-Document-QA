services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LEGAL_QA_ROOT: /app
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./data/retrieval/chroma:/app/data/retrieval/chroma:ro
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/models/huggingface:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
